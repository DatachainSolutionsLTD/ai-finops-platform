# =============================================================================
# Security Hardening — Seed Round Production Readiness
# Scope: mTLS between agents, automated credential rotation, TLS 1.2+,
#        Pod Security Standards, network policy tightening
# =============================================================================

---
# ---------------------------------------------------------------------------
# 1. CERT-MANAGER: TLS Certificate Automation
# ---------------------------------------------------------------------------
# cert-manager issues and rotates TLS certificates for all agent services.
# At Angel, this is replaced by Istio mTLS. At Seed, cert-manager provides
# TLS termination at the service level.

apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: finops-internal-ca
spec:
  selfSigned: {}  # Self-signed CA for internal mTLS (Seed)
  # Angel: replace with Let's Encrypt or Vault PKI

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: finops-internal-ca-cert
  namespace: cert-manager
spec:
  isCA: true
  commonName: finops-internal-ca
  secretName: finops-internal-ca-tls
  duration: 8760h    # 1 year
  renewBefore: 720h  # Renew 30 days before expiry
  issuerRef:
    name: finops-internal-ca
    kind: ClusterIssuer
  privateKey:
    algorithm: RSA
    size: 4096

---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: finops-ca-issuer
  namespace: tenant-g42-seed
spec:
  ca:
    secretName: finops-internal-ca-tls

---
# Per-agent TLS certificate (issued by internal CA)
# Template — replicate for each agent
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: finops-a01-tls
  namespace: tenant-g42-seed
spec:
  secretName: finops-a01-tls-cert
  duration: 720h      # 30 days
  renewBefore: 168h   # Renew 7 days before expiry (auto-rotation)
  commonName: finops-a01-data-ingestion
  dnsNames:
    - finops-a01-data-ingestion
    - finops-a01-data-ingestion.tenant-g42-seed
    - finops-a01-data-ingestion.tenant-g42-seed.svc.cluster.local
  issuerRef:
    name: finops-ca-issuer
    kind: Issuer
  privateKey:
    algorithm: RSA
    size: 2048
    rotationPolicy: Always

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: finops-a02-tls
  namespace: tenant-g42-seed
spec:
  secretName: finops-a02-tls-cert
  duration: 720h
  renewBefore: 168h
  commonName: finops-a02-cost-normalization
  dnsNames:
    - finops-a02-cost-normalization
    - finops-a02-cost-normalization.tenant-g42-seed
    - finops-a02-cost-normalization.tenant-g42-seed.svc.cluster.local
  issuerRef: { name: finops-ca-issuer, kind: Issuer }
  privateKey: { algorithm: RSA, size: 2048, rotationPolicy: Always }

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: finops-a03-tls
  namespace: tenant-g42-seed
spec:
  secretName: finops-a03-tls-cert
  duration: 720h
  renewBefore: 168h
  commonName: finops-a03-allocation
  dnsNames:
    - finops-a03-allocation
    - finops-a03-allocation.tenant-g42-seed
    - finops-a03-allocation.tenant-g42-seed.svc.cluster.local
  issuerRef: { name: finops-ca-issuer, kind: Issuer }
  privateKey: { algorithm: RSA, size: 2048, rotationPolicy: Always }

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: finops-a04-tls
  namespace: tenant-g42-seed
spec:
  secretName: finops-a04-tls-cert
  duration: 720h
  renewBefore: 168h
  commonName: finops-a04-reporting-analytics
  dnsNames:
    - finops-a04-reporting-analytics
    - finops-a04-reporting-analytics.tenant-g42-seed
    - finops-a04-reporting-analytics.tenant-g42-seed.svc.cluster.local
  issuerRef: { name: finops-ca-issuer, kind: Issuer }
  privateKey: { algorithm: RSA, size: 2048, rotationPolicy: Always }

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: finops-a05-tls
  namespace: tenant-g42-seed
spec:
  secretName: finops-a05-tls-cert
  duration: 720h
  renewBefore: 168h
  commonName: finops-a05-anomaly-detection
  dnsNames:
    - finops-a05-anomaly-detection
    - finops-a05-anomaly-detection.tenant-g42-seed
    - finops-a05-anomaly-detection.tenant-g42-seed.svc.cluster.local
  issuerRef: { name: finops-ca-issuer, kind: Issuer }
  privateKey: { algorithm: RSA, size: 2048, rotationPolicy: Always }

---
# ---------------------------------------------------------------------------
# 2. POD SECURITY STANDARDS — Enforce restricted profile
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Namespace
metadata:
  name: tenant-g42-seed
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted

---
# ---------------------------------------------------------------------------
# 3. VAULT CREDENTIAL ROTATION — CronJob for automated rotation
# ---------------------------------------------------------------------------
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vault-credential-rotation
  namespace: finops-platform
spec:
  schedule: "0 */6 * * *"  # Every 6 hours
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: vault-rotation-sa
          restartPolicy: OnFailure
          containers:
            - name: rotator
              image: hashicorp/vault:1.15
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  export VAULT_ADDR="http://vault.finops-platform:8200"

                  # Authenticate via K8s SA
                  VAULT_TOKEN=$(vault write -field=token auth/kubernetes/login \
                    role=credential-rotator \
                    jwt=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token))
                  export VAULT_TOKEN

                  echo "=== Rotating AWS credentials ==="
                  # Check if AWS credentials are near expiry
                  # Real implementation: use Vault dynamic secrets engine
                  # or trigger IAM key rotation via AWS API
                  vault read secret/data/tenants/g42-seed/cloud/aws > /dev/null 2>&1
                  echo "AWS credential check completed"

                  echo "=== Rotating agent signing keys ==="
                  for agent in A01 A02 A03 A04 A05 A27; do
                    KEY_AGE=$(vault kv metadata get -format=json \
                      secret/agents/${agent}/signing_key | \
                      jq -r '.data.updated_time' 2>/dev/null || echo "")
                    echo "Agent ${agent} key last updated: ${KEY_AGE}"
                    # Monthly rotation — skip if < 25 days old
                  done

                  echo "=== Verifying Vault health ==="
                  vault status

                  echo "Credential rotation cycle complete"
              resources:
                requests: { cpu: "50m", memory: "64Mi" }
                limits: { cpu: "200m", memory: "128Mi" }

---
# ---------------------------------------------------------------------------
# 4. TIGHTENED NETWORK POLICIES — Production hardening
# ---------------------------------------------------------------------------

# Block all egress by default, then allow specific destinations
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: tenant-g42-seed
spec:
  podSelector: {}
  policyTypes:
    - Egress

---
# Allow egress to specific infrastructure only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-infrastructure-egress
  namespace: tenant-g42-seed
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # PostgreSQL (RDS)
    - ports: [{ port: 5432, protocol: TCP }]
    # Redis (ElastiCache)
    - ports: [{ port: 6379, protocol: TCP }]
    # Vault
    - ports: [{ port: 8200, protocol: TCP }]
    # DNS
    - ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
    # HTTPS outbound (for AWS API, Anthropic LLM API)
    - ports: [{ port: 443, protocol: TCP }]
    # Airflow (platform namespace)
    - ports: [{ port: 8080, protocol: TCP }]
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: finops-platform
    # Prometheus (monitoring namespace — metrics scrape)
    - ports: [{ port: 9090, protocol: TCP }]
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: finops-monitoring
    # Agent-to-agent within namespace (inter-agent HTTP calls)
    - ports: [{ port: 8080, protocol: TCP }]
      to:
        - podSelector: {}

---
