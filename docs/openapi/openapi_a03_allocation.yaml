openapi: 3.1.0
info:
  title: Allocation Agent API (A03)
  description: |
    REST API for the Allocation Agent — manages allocation rules, shared service
    pools, allocation runs, chargeback generation, and impact simulation.
    Domain: Allocation. Seed Round scope.
  version: 1.0.0
servers:
  - url: /api/v1/allocation
security:
  - BearerAuth: []
tags:
  - name: Allocation Rules
  - name: Shared Service Pools
  - name: Allocation Runs
  - name: Chargeback
  - name: Simulation
  - name: Health

paths:
  /rules:
    get:
      tags: [Allocation Rules]
      summary: List allocation rules for tenant
      operationId: listAllocationRules
      parameters:
        - { name: X-Tenant-ID, in: header, required: true, schema: { type: string, format: uuid } }
        - { name: allocation_model, in: query, schema: { type: string, enum: [Fixed, Proportional, Dynamic] } }
        - { name: approval_status, in: query, schema: { type: string, enum: [Draft, Pending_Approval, Approved, Rejected] } }
        - { name: is_active, in: query, schema: { type: boolean, default: true } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, default: 25 } }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/AllocationRule' } }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
                  summary:
                    type: object
                    properties:
                      total_rules: { type: integer }
                      active_rules: { type: integer }
                      coverage_rate_pct: { type: number }
                      unattributed_cost_pct: { type: number }
    post:
      tags: [Allocation Rules]
      summary: Create an allocation rule
      operationId: createAllocationRule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AllocationRuleRequest' }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AllocationRule' }

  /rules/{rule_id}:
    parameters:
      - { name: rule_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Allocation Rules]
      summary: Get allocation rule details
      operationId: getAllocationRule
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AllocationRule' }
    put:
      tags: [Allocation Rules]
      summary: Update an allocation rule
      operationId: updateAllocationRule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AllocationRuleRequest' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AllocationRule' }
    delete:
      tags: [Allocation Rules]
      summary: Delete an allocation rule
      operationId: deleteAllocationRule
      responses:
        '204': { description: Rule deleted }

  /rules/{rule_id}/approve:
    post:
      tags: [Allocation Rules]
      summary: Approve or reject an allocation rule
      operationId: approveAllocationRule
      parameters:
        - { name: rule_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [Approved, Rejected] }
                notes: { type: string, maxLength: 500 }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AllocationRule' }

  /rules/{rule_id}/simulate:
    post:
      tags: [Simulation]
      summary: Simulate allocation impact before applying
      operationId: simulateAllocationRule
      parameters:
        - { name: rule_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                billing_period: { type: string, format: date }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  simulation_id: { type: string, format: uuid }
                  current_allocation:
                    type: object
                    properties:
                      total_cost_sar: { type: number }
                      coverage_rate_pct: { type: number }
                      owner_breakdown: { type: array, items: { type: object } }
                  proposed_allocation:
                    type: object
                    properties:
                      total_cost_sar: { type: number }
                      coverage_rate_pct: { type: number }
                      owner_breakdown: { type: array, items: { type: object } }
                  delta:
                    type: object
                    properties:
                      coverage_change_pct: { type: number }
                      affected_records: { type: integer }
                      cost_redistribution_sar: { type: number }

  /pools:
    get:
      tags: [Shared Service Pools]
      summary: List shared service pools
      operationId: listSharedPools
      parameters:
        - { name: X-Tenant-ID, in: header, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/SharedServicePool' } }
    post:
      tags: [Shared Service Pools]
      summary: Create a shared service pool
      operationId: createSharedPool
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SharedPoolRequest' }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SharedServicePool' }

  /runs:
    get:
      tags: [Allocation Runs]
      summary: List allocation pipeline runs
      operationId: listAllocationRuns
      parameters:
        - { name: X-Tenant-ID, in: header, required: true, schema: { type: string, format: uuid } }
        - { name: billing_period, in: query, schema: { type: string, format: date } }
        - { name: status, in: query, schema: { type: string, enum: [Running, Completed, Partial, Failed] } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/AllocationRun' } }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }

  /chargeback:
    get:
      tags: [Chargeback]
      summary: Get chargeback summary for a billing period
      operationId: getChargebackSummary
      parameters:
        - { name: X-Tenant-ID, in: header, required: true, schema: { type: string, format: uuid } }
        - { name: billing_period, in: query, required: true, schema: { type: string, format: date } }
        - { name: group_by, in: query, schema: { type: string, enum: [bu, application, project, cost_center], default: bu } }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  billing_period: { type: string, format: date }
                  total_chargeback_sar: { type: number }
                  coverage_rate_pct: { type: number }
                  groups:
                    type: array
                    items:
                      type: object
                      properties:
                        owner_id: { type: string, format: uuid }
                        owner_name: { type: string }
                        direct_cost_sar: { type: number }
                        shared_cost_sar: { type: number }
                        idle_tax_sar: { type: number }
                        total_cost_sar: { type: number }
                        mom_change_pct: { type: number }

  /chargeback/export:
    get:
      tags: [Chargeback]
      summary: Export chargeback data as CSV/XLSX
      operationId: exportChargeback
      parameters:
        - { name: X-Tenant-ID, in: header, required: true, schema: { type: string, format: uuid } }
        - { name: billing_period, in: query, required: true, schema: { type: string, format: date } }
        - { name: format, in: query, schema: { type: string, enum: [csv, xlsx], default: csv } }
      responses:
        '200':
          content:
            application/octet-stream:
              schema: { type: string, format: binary }

  /health/summary:
    get:
      tags: [Health]
      summary: Get allocation health dashboard summary
      operationId: getAllocationHealth
      parameters:
        - { name: X-Tenant-ID, in: header, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_rules: { type: integer }
                  active_rules: { type: integer }
                  coverage_rate_pct: { type: number }
                  unattributed_cost_pct: { type: number }
                  last_run_status: { type: string }
                  last_run_timestamp: { type: string, format: date-time }
                  shared_pools_active: { type: integer }
                  pending_approvals: { type: integer }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    PaginationMeta:
      type: object
      properties:
        page: { type: integer }
        page_size: { type: integer }
        total_items: { type: integer }
        total_pages: { type: integer }

    AllocationRule:
      type: object
      properties:
        rule_id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        rule_name: { type: string }
        allocation_model: { type: string }
        resource_scope: { type: object }
        owner_type: { type: string }
        owner_id: { type: string, format: uuid }
        shared_pool_id: { type: string, format: uuid }
        priority: { type: integer }
        distribution_key: { type: string }
        idle_tax_enabled: { type: boolean }
        idle_tax_rate_pct: { type: number }
        is_active: { type: boolean }
        effective_from: { type: string, format: date }
        effective_to: { type: string, format: date }
        approval_status: { type: string }
        created_date: { type: string, format: date-time }
        last_modified_date: { type: string, format: date-time }

    AllocationRuleRequest:
      type: object
      required: [rule_name, allocation_model, resource_scope, owner_type, priority, effective_from]
      properties:
        rule_name: { type: string, minLength: 3, maxLength: 200 }
        allocation_model: { type: string, enum: [Fixed, Proportional, Dynamic] }
        resource_scope: { type: object }
        owner_type: { type: string, enum: [BU, Application, Project, CostCenter, SharedPool] }
        owner_id: { type: string, format: uuid }
        shared_pool_id: { type: string, format: uuid }
        priority: { type: integer, minimum: 1, maximum: 999 }
        distribution_key: { type: string, enum: [Utilization, Reservation, Headcount, Custom] }
        idle_tax_enabled: { type: boolean, default: false }
        idle_tax_rate_pct: { type: number, default: 100 }
        effective_from: { type: string, format: date }
        effective_to: { type: string, format: date }

    SharedServicePool:
      type: object
      properties:
        pool_id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        pool_name: { type: string }
        description: { type: string }
        resource_scope: { type: object }
        distribution_method: { type: string }
        idle_tax_enabled: { type: boolean }
        is_active: { type: boolean }

    SharedPoolRequest:
      type: object
      required: [pool_name, resource_scope, distribution_method]
      properties:
        pool_name: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 500 }
        resource_scope: { type: object }
        distribution_method: { type: string, enum: [Proportional_Utilization, Proportional_Headcount, Equal_Split, Custom] }
        idle_tax_enabled: { type: boolean, default: true }

    AllocationRun:
      type: object
      properties:
        run_id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        billing_period: { type: string, format: date }
        trigger_type: { type: string }
        start_timestamp: { type: string, format: date-time }
        end_timestamp: { type: string, format: date-time }
        status: { type: string }
        records_input: { type: integer }
        records_allocated: { type: integer }
        records_unattributed: { type: integer }
        total_cost_input_sar: { type: number }
        total_cost_allocated_sar: { type: number }
        reconciliation_variance_pct: { type: number }
        coverage_rate_pct: { type: number }
        duration_seconds: { type: integer }
