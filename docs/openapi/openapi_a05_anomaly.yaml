openapi: 3.1.0
info:
  title: Anomaly Detection Agent API (A05)
  description: |
    REST API for the Anomaly Detection Agent — manages anomaly lifecycle,
    detection runs, alerts, suppression rules, and investigation workflows.
    Domain: Analytics (shared with A04). Seed Round scope.
  version: 1.0.0
servers:
  - url: /api/v1/anomaly
security:
  - BearerAuth: []
tags:
  - name: Anomalies
  - name: Detection Runs
  - name: Alerts
  - name: Suppression Rules
  - name: Configuration
  - name: Health

paths:
  /anomalies:
    get:
      tags: [Anomalies]
      summary: List detected anomalies
      operationId: listAnomalies
      parameters:
        - { name: X-Tenant-ID, in: header, required: true, schema: { type: string, format: uuid } }
        - { name: severity, in: query, schema: { type: string, enum: [Informational, Warning, Critical] } }
        - { name: lifecycle_status, in: query, schema: { type: string, enum: [Detected, Acknowledged, Investigating, Resolved_Confirmed, Resolved_False_Positive, Resolved_Expected, Auto_Suppressed] } }
        - { name: provider, in: query, schema: { type: string } }
        - { name: service_name, in: query, schema: { type: string } }
        - { name: root_cause_category, in: query, schema: { type: string } }
        - { name: detected_after, in: query, schema: { type: string, format: date-time } }
        - { name: detected_before, in: query, schema: { type: string, format: date-time } }
        - { name: min_impact_sar, in: query, schema: { type: number }, description: "Filter by minimum 30-day projected impact" }
        - { name: sort_by, in: query, schema: { type: string, default: severity_score, enum: [severity_score, detection_timestamp, financial_impact_30d_sar, deviation_pct] } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, default: 25 } }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/AnomalyRecord' } }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
                  summary:
                    type: object
                    properties:
                      total_active: { type: integer }
                      critical: { type: integer }
                      warning: { type: integer }
                      informational: { type: integer }
                      total_impact_sar: { type: number }

  /anomalies/{anomaly_id}:
    get:
      tags: [Anomalies]
      summary: Get anomaly details with full history
      operationId: getAnomaly
      parameters:
        - { name: anomaly_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/AnomalyRecord' }
                  - type: object
                    properties:
                      lifecycle_history:
                        type: array
                        items: { $ref: '#/components/schemas/LifecycleTransition' }
                      alerts_sent:
                        type: array
                        items: { $ref: '#/components/schemas/AlertEntry' }
                      correlated_anomalies:
                        type: array
                        items:
                          type: object
                          properties:
                            anomaly_id: { type: string, format: uuid }
                            severity: { type: string }
                            service_name: { type: string }
                            deviation_pct: { type: number }

  /anomalies/{anomaly_id}/transition:
    post:
      tags: [Anomalies]
      summary: Transition anomaly lifecycle state
      operationId: transitionAnomaly
      parameters:
        - { name: anomaly_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_status]
              properties:
                new_status: { type: string, enum: [Acknowledged, Investigating, Resolved_Confirmed, Resolved_False_Positive, Resolved_Expected] }
                notes: { type: string, maxLength: 4000 }
                remediation_action: { type: string, maxLength: 4000 }
                financial_impact_confirmed_sar: { type: number }
                root_cause_validated: { type: string, enum: [Billing_Error, Resource_Misconfiguration, Demand_Spike, Pricing_Change, Security_Incident, Data_Quality] }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnomalyRecord' }
        '409':
          description: Invalid state transition

  /anomalies/{anomaly_id}/report:
    post:
      tags: [Anomalies]
      summary: Manually report a cost anomaly
      operationId: reportAnomaly
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [description, provider, estimated_impact_sar]
              properties:
                description: { type: string, maxLength: 4000 }
                provider: { type: string }
                service_name: { type: string }
                region: { type: string }
                estimated_impact_sar: { type: number }
                billing_period: { type: string, format: date }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnomalyRecord' }

  /detection-runs:
    get:
      tags: [Detection Runs]
      summary: List detection cycle runs
      operationId: listDetectionRuns
      parameters:
        - { name: X-Tenant-ID, in: header, required: true, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [Running, Completed, Partial, Timeout, Failed] } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/DetectionRun' } }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }

  /detection-runs/trigger:
    post:
      tags: [Detection Runs]
      summary: Trigger an on-demand detection cycle
      operationId: triggerDetection
      responses:
        '202':
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_id: { type: string, format: uuid }
                  status: { type: string, const: Running }

  /suppression-rules:
    get:
      tags: [Suppression Rules]
      summary: List suppression rules
      operationId: listSuppressionRules
      parameters:
        - { name: X-Tenant-ID, in: header, required: true, schema: { type: string, format: uuid } }
        - { name: is_active, in: query, schema: { type: boolean, default: true } }
        - { name: rule_type, in: query, schema: { type: string, enum: [Explicit, Learned, User_Feedback] } }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/SuppressionRule' } }
    post:
      tags: [Suppression Rules]
      summary: Create a suppression rule
      operationId: createSuppressionRule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SuppressionRuleRequest' }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuppressionRule' }

  /suppression-rules/{rule_id}:
    parameters:
      - { name: rule_id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [Suppression Rules]
      summary: Update a suppression rule
      operationId: updateSuppressionRule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SuppressionRuleRequest' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuppressionRule' }
    delete:
      tags: [Suppression Rules]
      summary: Delete a suppression rule
      operationId: deleteSuppressionRule
      responses:
        '204': { description: Rule deleted }

  /health/summary:
    get:
      tags: [Health]
      summary: Get anomaly detection health summary
      operationId: getAnomalyHealth
      parameters:
        - { name: X-Tenant-ID, in: header, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_active_anomalies: { type: integer }
                  critical: { type: integer }
                  warning: { type: integer }
                  informational: { type: integer }
                  anomalies_this_period: { type: integer }
                  mttd_hours: { type: number }
                  mttr_hours: { type: number }
                  false_positive_rate_pct: { type: number }
                  suppression_rules_active: { type: integer }
                  storm_mode_active: { type: boolean }
                  last_detection_run: { type: string, format: date-time }
                  total_confirmed_impact_sar: { type: number }

  /health/heatmap:
    get:
      tags: [Health]
      summary: Get anomaly heatmap (provider × service category)
      operationId: getAnomalyHeatmap
      parameters:
        - { name: X-Tenant-ID, in: header, required: true, schema: { type: string, format: uuid } }
        - { name: days, in: query, schema: { type: integer, default: 30, enum: [7, 30, 90] } }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  rows:
                    type: array
                    items:
                      type: object
                      properties:
                        provider: { type: string }
                        cells:
                          type: array
                          items:
                            type: object
                            properties:
                              service_category: { type: string }
                              anomaly_count: { type: integer }
                              max_severity: { type: string }

components:
  securitySchemes:
    BearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }

  schemas:
    PaginationMeta:
      type: object
      properties:
        page: { type: integer }
        page_size: { type: integer }
        total_items: { type: integer }
        total_pages: { type: integer }

    AnomalyRecord:
      type: object
      properties:
        anomaly_id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        detection_run_id: { type: string, format: uuid }
        detection_method: { type: string }
        detection_timestamp: { type: string, format: date-time }
        severity: { type: string }
        severity_score: { type: number }
        root_cause_category: { type: string }
        root_cause_confidence: { type: number }
        provider: { type: string }
        service_name: { type: string }
        region: { type: string }
        business_unit_id: { type: string, format: uuid }
        application_id: { type: string, format: uuid }
        environment: { type: string }
        baseline_value_sar: { type: number }
        actual_value_sar: { type: number }
        deviation_amount_sar: { type: number }
        deviation_pct: { type: number }
        deviation_direction: { type: string }
        financial_impact_7d_sar: { type: number }
        financial_impact_30d_sar: { type: number }
        blast_radius: { type: integer }
        confidence_score: { type: number }
        lifecycle_status: { type: string }
        resolution_type: { type: string }
        resolution_notes: { type: string }
        resolved_by: { type: string, format: uuid }
        resolved_timestamp: { type: string, format: date-time }
        correlation_group_id: { type: string, format: uuid }

    LifecycleTransition:
      type: object
      properties:
        transition_id: { type: string, format: uuid }
        previous_status: { type: string }
        new_status: { type: string }
        transitioned_by: { type: string, format: uuid }
        transition_timestamp: { type: string, format: date-time }
        notes: { type: string }
        remediation_action: { type: string }

    AlertEntry:
      type: object
      properties:
        alert_id: { type: string, format: uuid }
        channel: { type: string }
        delivery_status: { type: string }
        alert_timestamp: { type: string, format: date-time }

    DetectionRun:
      type: object
      properties:
        run_id: { type: string, format: uuid }
        trigger_type: { type: string }
        start_timestamp: { type: string, format: date-time }
        end_timestamp: { type: string, format: date-time }
        status: { type: string }
        dimensions_scanned: { type: integer }
        records_analyzed: { type: integer }
        anomalies_detected: { type: integer }
        anomalies_suppressed: { type: integer }
        models_used: { type: string }
        duration_seconds: { type: integer }

    SuppressionRule:
      type: object
      properties:
        rule_id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        rule_name: { type: string }
        rule_type: { type: string }
        match_criteria: { type: object }
        max_severity_suppressed: { type: string }
        effective_from: { type: string, format: date-time }
        effective_to: { type: string, format: date-time }
        trigger_count: { type: integer }
        is_active: { type: boolean }

    SuppressionRuleRequest:
      type: object
      required: [rule_name, match_criteria, max_severity_suppressed, effective_from]
      properties:
        rule_name: { type: string, minLength: 3, maxLength: 200 }
        rule_type: { type: string, enum: [Explicit, User_Feedback], default: Explicit }
        match_criteria: { type: object, description: "Dimension matching pattern (provider, service, region, etc.)" }
        max_severity_suppressed: { type: string, enum: [Informational, Warning] }
        effective_from: { type: string, format: date-time }
        effective_to: { type: string, format: date-time }
