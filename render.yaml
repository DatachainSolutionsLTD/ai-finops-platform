# Render Blueprint — deploy backend + frontend as separate services
# Docs: https://docs.render.com/blueprint-spec
services:
  # Python Backend
  - type: web
    name: ai-finops-api
    runtime: python
    repo: https://github.com/YOUR-USERNAME/ai-finops-platform
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn agents.a01_data_ingestion.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false  # Set manually in Render dashboard
      - key: REDIS_URL
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.0"

  # Angular Frontend (static site)
  - type: web
    name: ai-finops-app
    runtime: static
    repo: https://github.com/YOUR-USERNAME/ai-finops-platform
    rootDir: frontend
    buildCommand: npm install && npm run build:prod
    staticPublishPath: dist/ai-finops/browser
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    plan: free
